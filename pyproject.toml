[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventbreaker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "openai>=1.35",
    "rich>=13.7",
]

[project.scripts]
eventbreaker = "eventbreaker.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["eventbreaker*"]
